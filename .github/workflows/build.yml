name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean build cache
      run: ./gradlew clean --no-daemon
      shell: bash

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info --rerun-tasks 2>&1 | tee build.log
      shell: bash

    - name: Show build errors on failure
      if: failure()
      run: |
        echo "==================== BUILD ERRORS ===================="
        grep -E "^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by:|\.kt:" build.log | head -100 || true
        echo "==================== LAST 120 LINES ===================="
        tail -120 build.log || true
      shell: bash

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EnglishWorld-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload website as Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: website

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
